{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}سایت موسیقی{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'music/css/style.css' %}">
</head>
<body>

    <!-- سایدبار -->
    <aside class="sidebar">

        <div class="logo">🎵 موسیقی</div>
       
        <ul>
            <li><a href="{% url 'music:song_list' %}" class="{% if request.resolver_match.url_name == 'song_list' %}active{% endif %}">🏠 خانه</a></li>
            <li><a href="{% url 'music:artist_list' %}" class="{% if request.resolver_match.url_name == 'artist_list' %}active{% endif %}">🎤 خواننده‌ها</a></li>
            <li><a href="/admin/" target="_blank">⚙️ پنل مدیریت</a></li>
        </ul>
        <a href="{% url 'music:search' %}" class="btn btn-warning" class="{% if request.resolver_match.url_name == 'search' %}active{% endif %}">🔍 جستجو</a><br><br>
         {% if user.is_staff %}
           <a href="{% url 'music:song_add' %}" class="btn btn-success">➕ افزودن آهنگ</a>
        {% endif %}<br><br>
                      {% if user.is_authenticated %}
                         <a href="{% url 'music:my_liked_songs' %}" class="btn btn-danger">❤️ آهنگ‌های لایک‌شده</a>
                      {% endif %}
    </aside>

    <!-- محتوای اصلی -->
    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

    <!-- پخش‌کننده‌ی چسبیده -->
    <div class="sticky-player" id="stickyPlayer">
        <audio id="audioPlayer" controls></audio>
    </div>

    <!-- اسکریپت پخش‌کننده -->
    <script>
        function playSong(audioUrl) {
            const player = document.getElementById('audioPlayer');
            const playerContainer = document.getElementById('stickyPlayer');
            player.src = audioUrl;
            player.play();
            playerContainer.classList.add('visible');
        }
    </script>

</body>
</html>

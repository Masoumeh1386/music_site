{% extends 'music/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger" style="border-width: 2px !important;">
            <div class="card-body text-center">
                <h3 class="text-danger mb-4">⚠️ تأیید حذف</h3>

                <p class="mb-4">
                    مطمئنی می‌خوای آهنگ
                    <strong>«{{ object.title }}»</strong>
                    از خواننده
                    <strong>{{ object.artist.name }}</strong>
                    رو حذف کنی؟
                </p>

                {% if object.cover %}
                    <img src="{{ object.cover.url }}" 
                         class="img-fluid mb-4 rounded" 
                         style="max-height: 200px;">
                {% endif %}

                <p class="text-warning mb-4">
                    ⚠️ این عمل قابل بازگشت نیست!
                </p>

                <form method="POST">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">
                        🗑️ بله، حذف کن
                    </button>
                    <a href="{% url 'music:song_detail' object.pk %}" class="btn btn-secondary">
                        انصراف
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

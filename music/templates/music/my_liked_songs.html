{% extends 'music/base.html' %}

{% block content %}
<h1>آهنگ‌های لایک‌شده</h1>

<div class="row">
    {% for song in songs %}
        <div class="col-md-6 col-lg-4 mb-4">
            <div class="card h-100">
                {% if song.cover %}
                    <img src="{{ song.cover.url }}" class="card-img-top">
                {% endif %}
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">{{ song.title }}</h5>
                    <p class="card-text">🎤 {{ song.artist.name }}</p>
                    <a href="{% url 'music:song_detail' song.pk %}" class="btn btn-primary btn-sm mt-auto">
                        جزئیات
                    </a>
                </div>
            </div>
        </div>
    {% empty %}
        <div class="col-12">
            <p>هنوز آهنگی رو لایک نکردی.</p>
        </div>
    {% endfor %}
</div>
{% endblock %}
